name: Release

# Pushing a tag like v1.0.1 creates a GitHub Release for it, which is what
# HACS lists as an installable version. There is nothing to build: HACS
# installs custom_components/christie_m4k25/ straight from the tagged commit.
#
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the Release
      actions: read # look up the CI run for the tagged commit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Home Assistant and HACS read the version from manifest.json, so a
      # tag that disagrees with it would publish a Release that reports a
      # different version once installed. pyproject.toml must agree too.
      - name: Check the tag matches manifest.json and pyproject.toml
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib

          tag = os.environ["TAG"]
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?", tag)
          if not m:
              sys.exit(f"tag {tag!r} is not vMAJOR.MINOR.PATCH[-suffix]")
          manifest = json.load(open("custom_components/christie_m4k25/manifest.json"))["version"]
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          for name, version in (("manifest.json", manifest), ("pyproject.toml", pyproject)):
              if version != m.group(1):
                  sys.exit(f"tag {tag} != {name} version {version!r}")
          print(f"tag {tag} matches manifest.json and pyproject.toml ({manifest})")
          PY

      # Only ever release what is on main -- not a tag pushed onto some
      # other branch.
      - name: Check the tagged commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      # The TruffleHog action does nothing on a tag push (it scans the push's
      # commit list, which is empty for a tag), so calling it here would be a
      # green check that scanned nothing. CI's run on this commit did scan it
      # -- and CI's other jobs `needs:` that scan -- so require CI to have
      # passed. Waits, since the tag is often pushed right after the commit.
      - name: Require a passing CI run on this commit (includes the secret scan)
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh run list --workflow CI --commit "$GITHUB_SHA" --json status,conclusion)
            ok=$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$ok" -ge 1 ]; then
              echo "CI passed for $GITHUB_SHA"
              exit 0
            fi
            if [ "$pending" -eq 0 ] && [ "$attempt" -gt 3 ]; then
              echo "::error::No passing CI run for $GITHUB_SHA, and none in progress"
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA (attempt $attempt)..."
            sleep 20
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

      - name: Publish the GitHub Release
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flags
          fi
